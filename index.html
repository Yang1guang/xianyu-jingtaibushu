<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>印记 - 私密网页高级托管引擎</title>

  <!-- 🌟 仓库已上传的网页图标标准调用[cite: 3] -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <style>
    /* 🌟 暗金深色主题变量（默认） */
    :root {
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --bg-main: #020617;
      --bg-gradient: radial-gradient(circle at top right, rgba(245,158,11,0.1), transparent 40%), radial-gradient(circle at bottom left, rgba(217,119,6,0.1), transparent 40%), #020617;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(245, 158, 11, 0.4);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --panel-border-dashed: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(0, 0, 0, 0.3);
      --input-border: rgba(255, 255, 255, 0.1);
      --input-color: #ffffff;
      --btn-bg: rgba(255, 255, 255, 0.05);
      --btn-border: rgba(255, 255, 255, 0.1);
      --btn-color: #ffffff;
      --dashboard-bg: #1e293b;
      --dashboard-border: #334155;
      --dashboard-color: #cbd5e1;
      --page-card-bg: rgba(0, 0, 0, 0.3);
      --page-card-title: #fde68a;
      --action-btn-color: #cbd5e1;
      --action-btn-border: rgba(255, 255, 255, 0.1);
      --action-btn-bg: transparent;
      --logo-inner-bg: #090e1a;
      --preview-bg: rgba(0, 0, 0, 0.4);
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    /* 🌟 浅太阳暖金渐变主题 */
    body.theme-light {
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --bg-main: #fffbeb;
      --bg-gradient: radial-gradient(circle at top right, rgba(245,158,11,0.18), transparent 45%), radial-gradient(circle at bottom left, rgba(217,119,6,0.12), transparent 45%), linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #fde68a 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(245, 158, 11, 0.35);
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --panel-border-dashed: rgba(245, 158, 11, 0.25);
      --input-bg: #ffffff;
      --input-border: rgba(0, 0, 0, 0.12);
      --input-color: #1f2937;
      --btn-bg: #ffffff;
      --btn-border: rgba(0, 0, 0, 0.1);
      --btn-color: #1f2937;
      --dashboard-bg: rgba(255, 255, 255, 0.92);
      --dashboard-border: rgba(245, 158, 11, 0.38);
      --dashboard-color: #4b5563;
      --page-card-bg: #ffffff;
      --page-card-title: #b45309;
      --action-btn-color: #4b5563;
      --action-btn-border: rgba(0, 0, 0, 0.08);
      --action-btn-bg: #f8fafc;
      --logo-inner-bg: #ffffff;
      --preview-bg: rgba(241, 245, 249, 0.7);
      --shadow-color: rgba(245, 158, 11, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.3); border-radius: 4px; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-main);
      padding: 20px 16px 50px;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container { max-width: 1440px; margin: 0 auto; position: relative; z-index: 1; }

    /* 🌟 高奢黑金旋转边框「印记」Logo */
    .header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 16px; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px dashed rgba(245, 158, 11, 0.35);
    }
    .logo-area { display: flex; align-items: center; gap: 16px; }

    .logo-box {
      position: relative;
      padding: 2px;
      border-radius: 14px;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.25);
    }

    .logo-box::before {
      content: "";
      position: absolute;
      width: 250%;
      height: 250%;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        #d97706 20%,
        #fde68a 45%,
        #f59e0b 70%,
        transparent 100%
      );
      animation: rotateBorder 4s linear infinite;
      z-index: 1;
    }

    @keyframes rotateBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .logo-inner {
      position: relative;
      z-index: 2;
      background: var(--logo-inner-bg);
      padding: 6px 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    .logo-text {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #fde68a 0%, #f59e0b 50%, #d97706 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .header-desc { font-size: 13px; color: var(--text-sub); transition: color 0.3s ease; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 800; cursor: pointer; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-color); transition: all 0.2s; outline: none; text-decoration: none; }
    .btn:hover { border-color: var(--primary); background: rgba(245, 158, 11, 0.12); }
    .btn-primary { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25); }
    .btn-primary:hover { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 🌟 顶栏控制组与双主题切换按钮 */
    .header-ctrl-group {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      max-width: 100%;
    }

    .status-dashboard {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--dashboard-color);
      background: var(--dashboard-bg);
      padding: 5px 6px 5px 18px;
      border-radius: 99px;
      border: 1px solid var(--dashboard-border);
      box-shadow: 0 4px 15px var(--shadow-color);
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .status-dashboard .status-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .highlight { color: #f59e0b; font-weight: bold; }

    .btn-renew {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #fff;
      padding: 7px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
      white-space: nowrap;
    }
    .btn-renew:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.45);
      transform: translateY(-1px);
    }

    /* 主题模式切换小按钮 */
    .btn-theme-toggle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--dashboard-border);
      background: var(--dashboard-bg);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px var(--shadow-color);
      flex-shrink: 0;
      outline: none;
    }
    .btn-theme-toggle:hover {
      transform: rotate(20deg) scale(1.08);
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    /* 📱 移动端与苹果手机自适应对称排版 */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .logo-area {
        justify-content: center;
        width: 100%;
      }
      .header-ctrl-group {
        width: 100%;
        justify-content: center;
        gap: 8px;
      }
      .status-dashboard {
        width: calc(100% - 46px);
        max-width: 360px;
        margin: 0;
        border-radius: 18px;
        padding: 12px 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        align-items: center;
        justify-items: center;
      }
      .status-dashboard .status-item {
        font-size: 12px;
        gap: 4px;
        justify-content: center;
      }
      .status-dashboard .btn-renew {
        grid-column: 1 / -1;
        width: 100%;
        padding: 10px 0;
        font-size: 13px;
        letter-spacing: 1px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(245, 158, 11, 0.35);
      }
      .btn-theme-toggle {
        width: 38px;
        height: 38px;
        align-self: center;
      }
    }

    @media (max-width: 360px) {
      .status-dashboard .status-item { font-size: 11px; }
    }

    .workspace-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 18px; margin-bottom: 24px; }
    @media (max-width: 992px) { .workspace-grid { grid-template-columns: 1fr; } }

    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px var(--shadow-color);
      display: flex;
      flex-direction: column;
      height: 680px;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--panel-border-dashed); }
    .panel-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

    .config-grid { display: grid; grid-template-columns: 1.4fr 1.2fr 1fr; gap: 8px; margin-bottom: 10px; }
    @media (max-width: 640px) { .config-grid { grid-template-columns: 1fr; } }
    .input-field {
      padding: 10px 12px;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      font-size: 13px;
      background: var(--input-bg);
      color: var(--input-color);
      outline: none;
      transition: all 0.2s ease;
    }
    .input-field:focus { border-color: var(--primary); }

    .code-editor {
      flex: 1;
      width: 100%;
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 14px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      background: #020617;
      color: #38bdf8;
      outline: none;
      resize: none;
    }

    .preview-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--preview-bg);
      border-radius: 14px;
      border: 1px solid var(--panel-border-dashed);
      overflow: hidden;
      transition: background 0.3s ease;
    }
    .preview-iframe { width: 100%; height: 100%; border: none; background: #fff; transition: width 0.25s ease; }
    .preview-iframe.mobile-mode { width: 375px; height: 600px; border-radius: 24px; border: 6px solid #1f2937; }

    /* 卡片列表 */
    .assets-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px var(--shadow-color);
      transition: all 0.3s ease;
    }
    .page-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 16px;}
    .page-card {
      background: var(--page-card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.2s;
    }
    .page-card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .page-card-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--page-card-title); }
    .page-card-slug { font-size: 12px; color: var(--text-sub); font-family: monospace; }
    .page-card-meta { font-size: 12px; color: var(--text-sub); margin-top: 12px; display: flex; justify-content: space-between; }
    .page-card-actions { display: flex; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--panel-border-dashed); }
    .action-btn {
      flex: 1;
      padding: 6px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--action-btn-border);
      background: var(--action-btn-bg);
      cursor: pointer;
      color: var(--action-btn-color);
      transition: 0.2s;
      text-align: center;
      text-decoration: none;
    }
    .action-btn:hover { background: rgba(245, 158, 11, 0.15); color: var(--primary-hover); border-color: var(--primary); }

    .toast-msg { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(15, 23, 42, 0.95); color: #fff; padding: 12px 24px; border-radius: 24px; font-size: 14px; font-weight: 800; border: 1px solid var(--primary); box-shadow: 0 8px 30px rgba(0,0,0,0.6); z-index: 10000; opacity: 0; pointer-events: none; transition: 0.3s; }
    .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-msg.error { border-color: #ef4444; color: #fecaca; }

    /* 🌟 全屏权限锁定遮罩层 */
    .lock-overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 1; transition: opacity 0.4s; }
    .lock-overlay.hidden { opacity: 0; pointer-events: none; }
    .lock-card { background: #1e293b; border: 1.5px solid #f59e0b; padding: 40px; border-radius: 24px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
    .lock-title { font-size: 22px; color: #f8fafc; margin-bottom: 12px; font-weight: 900; letter-spacing: 1px;}
    .lock-desc { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.6;}
    .key-input { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; color: #fde68a; font-family: monospace; font-size: 15px; text-align: center; outline: none; margin-bottom: 16px; }
    .key-input:focus { border-color: #f59e0b; }
    .lock-actions { display: flex; gap: 12px; }
    
    #wxModal { display: none; margin-top: 20px; animation: slideDown 0.3s; }
    #wxModal img { width: 100%; max-width: 220px; border-radius: 12px; border: 4px solid #fff; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    /* 🌟 续费弹窗 */
    .renew-modal-overlay {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(12px);
      z-index: 10001; display: none; align-items: center; justify-content: center; animation: fadeIn 0.25s ease;
    }
    .renew-modal-card {
      position: relative; background: #1e293b; border: 1.5px solid var(--primary);
      padding: 30px 24px; border-radius: 24px; text-align: center; width: 90%; max-width: 390px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.8); animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .renew-close-btn {
      position: absolute; top: 14px; right: 16px; background: none; border: none;
      color: #94a3b8; font-size: 20px; cursor: pointer; transition: 0.2s;
    }
    .renew-close-btn:hover { color: #fff; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleUp { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <div id="toastMsg" class="toast-msg">✓ 操作成功</div>

  <!-- 🌟 顶栏联系续费与卡密累加弹窗 -->
  <div id="renewModal" class="renew-modal-overlay" onclick="closeRenewModal(event)">
    <div class="renew-modal-card" onclick="event.stopPropagation()">
      <button class="renew-close-btn" onclick="closeRenewModal()">✕</button>
      <div style="font-size: 34px; margin-bottom: 6px;">💎</div>
      <h3 style="font-size: 19px; color: #fde68a; margin-bottom: 4px; font-weight: 800;">时空授权续费</h3>
      <p style="font-size: 13px; color: #94a3b8; margin-bottom: 16px;">扫码联系管理员获取新卡密，或在下方直接充值续费</p>
      
      <div style="background: #fff; padding: 8px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 20px rgba(0,0,0,0.4);">
        <img src="/微信二维码.jpg" alt="微信二维码" onerror="this.src='微信二维码.jpg'" style="width: 180px; height: 180px; object-fit: cover; display: block; border-radius: 6px;">
      </div>

      <div style="margin-top: 18px; text-align: left;">
        <input type="text" id="renewKeyInput" class="key-input" placeholder="输入续费卡密: YJ-XXX-XXX..." style="margin-bottom: 10px;" autocomplete="off">
        <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;" onclick="submitRenewKey()">⚡ 立即累加使用时长</button>
      </div>
      <div style="margin-top: 10px; font-size: 12px; color: #64748b;">支持在原有剩余天数上叠加延长时长</div>
    </div>
  </div>

  <!-- 🌟 系统权限与到期锁定遮罩 -->
  <div class="lock-overlay" id="lockOverlay">
    <div class="lock-card">
      <div style="font-size: 48px; margin-bottom: 16px;">🔐</div>
      <h2 class="lock-title">印记时空未激活或已到期</h2>
      <p class="lock-desc">核心编辑权限已被锁定。<br>请输入授权卡密激活系统，或联系客服获取最新卡密。</p>
      <input type="text" id="licenseKeyInput" class="key-input" placeholder="输入卡密: YJ-XXX-XXX..." autocomplete="off">
      <div class="lock-actions">
        <button class="btn btn-primary" style="flex: 1; justify-content: center;" onclick="activateLicense()">🔑 立即验证激活</button>
        <button class="btn" style="flex: 1; justify-content: center;" onclick="toggleWxModal()">💬 微信咨询获取</button>
      </div>
      <div id="wxModal">
        <img src="/微信二维码.jpg" alt="扫码加微信获取卡密" onerror="this.src='微信二维码.jpg'">
        <p style="font-size:12px; color:#cbd5e1; margin-top:8px;">长按或扫码添加客服获取卡密</p>
      </div>
    </div>
  </div>

  <div class="container">
    <header class="header">
      <div class="logo-area">
        <!-- 🌟 旋转动态黑金光刃框 + 清爽无粒子高奢内嵌 -->
        <div class="logo-box">
          <div class="logo-inner">
            <div class="logo-text">印记</div>
          </div>
        </div>
        <div>
          <div class="header-desc" style="font-weight: bold; font-size: 14px; margin-top:0;">高阶私密单页托管引擎</div>
        </div>
      </div>

      <!-- 🌟 顶栏控制组：胶囊仪表盘 + 明暗主题切换小按钮 -->
      <div class="header-ctrl-group">
        <div class="status-dashboard">
          <span class="status-item" title="系统授权期限">⏳ 到期时间: <span class="highlight" id="expireDateTxt">检测中...</span></span>
          <span class="status-item" title="最大容量限制 20MB">💾 云端容量: <span class="highlight" id="storageTxt">0 MB / 20 MB</span></span>
          <button class="btn-renew" onclick="openRenewModal()">⚡ 续费</button>
        </div>

        <!-- 🌓 深浅主题快速切换按钮 -->
        <button id="themeToggleBtn" class="btn-theme-toggle" onclick="toggleTheme()" title="切换深色/浅太阳主题">☀️</button>
      </div>
    </header>

    <div class="workspace-grid">
      <!-- 左栏：源码与配置 -->
      <div class="panel-card">
        <div class="panel-header">
          <span class="panel-title">📄 网页源码与配置</span>
          <div style="display: flex; gap: 6px;">
            <button class="btn" onclick="document.getElementById('fileUpload').click()">📁 导入文件</button>
            <button class="btn" onclick="clearEditor()">🗑️ 清空</button>
            <input type="file" id="fileUpload" accept=".html,.htm" style="display:none;" onchange="handleFileImport(event)" />
          </div>
        </div>

        <div class="config-grid">
          <input type="text" id="pageTitleInput" class="input-field" placeholder="页面标题（留空自动抓取）" />
          <input type="text" id="pageSlugInput" class="input-field" placeholder="短链后缀（如: love，留空随机）" />
          <input type="password" id="pagePasswordInput" class="input-field" placeholder="访问密码（可选）" />
        </div>

        <textarea id="htmlCodeEditor" class="code-editor" placeholder="在此粘贴完整的 HTML 代码，或直接拖拽 .html 文件至此处..."></textarea>

        <div style="margin-top: 12px; display: flex; justify-content: space-between; align-items: center;">
          <span id="codeSizeTip" style="font-size: 12px; color: var(--text-sub);">当前代码：0 B</span>
          <button id="publishBtn" class="btn btn-primary" style="padding: 10px 24px; font-size: 14px;" onclick="publishPage()">🚀 立即发布并生成链接</button>
        </div>
      </div>

      <!-- 右栏：沙盒实时调试 -->
      <div class="panel-card">
        <div class="panel-header">
          <span class="panel-title">👁️ 沙盒实时预览</span>
          <div style="display: flex; gap: 6px;">
            <button id="viewPcBtn" class="btn btn-primary" onclick="setPreviewMode('pc')">💻 电脑模式</button>
            <button id="viewMobileBtn" class="btn" onclick="setPreviewMode('mobile')">📱 手机模式</button>
            <button class="btn" onclick="refreshPreview()">🔄 刷新视图</button>
          </div>
        </div>

        <div class="preview-container">
          <iframe id="previewIframe" class="preview-iframe" sandbox="allow-scripts allow-modals allow-same-origin allow-forms"></iframe>
        </div>
      </div>
    </div>

    <!-- 底部资产库 -->
    <div class="assets-section">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 16px; font-weight: 700;">📦 运行时空舱 (<span id="pageCount">0</span>)</span>
        <button class="btn" onclick="loadPageList()">🔄 刷新列表</button>
      </div>
      <div class="page-grid" id="pageGrid"></div>
    </div>
  </div>

  <script>
    const AUTH_STORAGE_KEY = "YINJI_LICENSE_KEY";
    const THEME_STORAGE_KEY = "YINJI_THEME_MODE";
    let licenseKey = localStorage.getItem(AUTH_STORAGE_KEY) || "";

    const titleInput = document.getElementById("pageTitleInput");
    const slugInput = document.getElementById("pageSlugInput");
    const pwdInput = document.getElementById("pagePasswordInput");
    const codeEditor = document.getElementById("htmlCodeEditor");
    const previewIframe = document.getElementById("previewIframe");
    const sizeTip = document.getElementById("codeSizeTip");
    const publishBtn = document.getElementById("publishBtn");
    let previewTimer = null;

    /* ==========================================================
       🌓 1. 深浅主题切换控制逻辑
    ========================================================== */
    function applyTheme(theme) {
      const btn = document.getElementById("themeToggleBtn");
      if (theme === "light") {
        document.body.classList.add("theme-light");
        if (btn) {
          btn.innerHTML = "🌙";
          btn.title = "当前：浅太阳主题，点击切换为暗金主题";
        }
      } else {
        document.body.classList.remove("theme-light");
        if (btn) {
          btn.innerHTML = "☀️";
          btn.title = "当前：暗金主题，点击切换为浅太阳主题";
        }
      }
      localStorage.setItem(THEME_STORAGE_KEY, theme);
    }

    function toggleTheme() {
      const isLight = document.body.classList.contains("theme-light");
      const nextTheme = isLight ? "dark" : "light";
      applyTheme(nextTheme);
      showToast(nextTheme === "light" ? "☀️ 已切换为浅太阳主题" : "🌙 已切换为暗金深色主题");
    }

    // 初始化时加载保存的主题偏好（默认深色）
    applyTheme(localStorage.getItem(THEME_STORAGE_KEY) || "dark");

    /* ==========================================================
       🛠️ 2. 编辑器与沙盒逻辑
    ========================================================== */
    function autoDetectTitle(html) {
      if (!html) return "";
      const match = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
      return match ? match[1].trim() : "";
    }

    codeEditor.addEventListener("input", () => {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(() => {
        const code = codeEditor.value;
        previewIframe.srcdoc = code.trim() ? code : "<div style='display:flex;height:100vh;align-items:center;justify-content:center;color:#94a3b8;'>等待输入源码...</div>";
        if (!titleInput.value.trim() && autoDetectTitle(code)) titleInput.value = autoDetectTitle(code);
      }, 400);
      sizeTip.innerText = `当前代码：${formatBytes(new Blob([codeEditor.value]).size)}`;
    });

    function refreshPreview() { previewIframe.srcdoc = codeEditor.value; showToast("视图已刷新"); }
    function setPreviewMode(mode) {
      const pcBtn = document.getElementById("viewPcBtn"), mobileBtn = document.getElementById("viewMobileBtn");
      if (mode === "mobile") { previewIframe.classList.add("mobile-mode"); mobileBtn.classList.add("btn-primary"); pcBtn.classList.remove("btn-primary"); }
      else { previewIframe.classList.remove("mobile-mode"); pcBtn.classList.add("btn-primary"); mobileBtn.classList.remove("btn-primary"); }
    }

    function handleFileImport(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        codeEditor.value = evt.target.result;
        titleInput.value = autoDetectTitle(codeEditor.value) || file.name.replace(/\.[^/.]+$/, "");
        slugInput.value = file.name.replace(/\.[^/.]+$/, "").toLowerCase().replace(/[^a-z0-9_-]/g, "");
        refreshPreview();
        sizeTip.innerText = `当前代码：${formatBytes(new Blob([codeEditor.value]).size)}`;
        showToast("✓ 源码导入成功");
      };
      reader.readAsText(file);
    }

    function toggleWxModal() {
      const wx = document.getElementById("wxModal");
      wx.style.display = wx.style.display === "block" ? "none" : "block";
    }

    function openRenewModal() {
      document.getElementById("renewModal").style.display = "flex";
      document.getElementById("renewKeyInput").value = "";
    }

    function closeRenewModal(e) {
      if (e) e.stopPropagation();
      document.getElementById("renewModal").style.display = "none";
    }

    /* ==========================================================
       🔒 3. 授权、续费与状态侦测
    ========================================================== */
    async function checkSystemStatus() {
      try {
        const res = await fetch("/api/system/status");
        const data = await res.json();
        
        if (data.expireAt) {
          const d = new Date(data.expireAt);
          document.getElementById("expireDateTxt").innerText = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
        }
        document.getElementById("storageTxt").innerText = `${formatBytes(data.usedStorage)} / 20 MB`;

        if (!data.licensed) {
          document.getElementById("lockOverlay").classList.remove("hidden");
        } else {
          document.getElementById("lockOverlay").classList.add("hidden");
          loadPageList();
        }
      } catch (err) {
        showToast("状态检测异常，请刷新", true);
      }
    }

    async function activateLicense() {
      const key = document.getElementById("licenseKeyInput").value.trim();
      if (!key) return showToast("请输入卡密", true);
      try {
        const res = await fetch("/api/auth/verify", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key })
        });
        const data = await res.json();
        if (data.valid) {
          licenseKey = key;
          localStorage.setItem(AUTH_STORAGE_KEY, key);
          showToast(`✨ 激活成功！已增加 ${data.addedDays} 天使用时长`);
          checkSystemStatus();
        } else {
          showToast(data.error || "卡密无效或已核销", true);
        }
      } catch (e) { showToast("网络异常", true); }
    }

    async function submitRenewKey() {
      const key = document.getElementById("renewKeyInput").value.trim();
      if (!key) return showToast("请输入续费卡密", true);
      try {
        const res = await fetch("/api/auth/verify", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key })
        });
        const data = await res.json();
        if (data.valid) {
          licenseKey = key;
          localStorage.setItem(AUTH_STORAGE_KEY, key);
          showToast(`🎉 续费成功！时长已向后叠加 ${data.addedDays} 天`);
          closeRenewModal();
          checkSystemStatus();
        } else {
          showToast(data.error || "续费失败：卡密无效或已使用", true);
        }
      } catch (e) { showToast("网络异常", true); }
    }

    async function publishPage() {
      const html = codeEditor.value;
      if (!html.trim()) return showToast("源码不能为空！", true);

      publishBtn.disabled = true; publishBtn.innerHTML = "⏳ 部署中...";
      try {
        const payload = {
          title: titleInput.value.trim() || autoDetectTitle(html) || slugInput.value.trim() || "未命名网页",
          slug: slugInput.value.trim(), html, password: pwdInput.value.trim()
        };
        const res = await fetch("/api/page/publish", {
          method: "POST", headers: { "Content-Type": "application/json", "x-license-key": licenseKey }, body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.status === 401) {
          checkSystemStatus(); return showToast("授权已失效，请重新激活续期", true);
        }
        if (data.error) return showToast(data.error, true);

        showToast("🚀 专属网页已成功发布上线！");
        checkSystemStatus();
        loadPageList();
        setTimeout(() => { if (confirm(`发布成功！\n链接：${window.location.origin}/p/${data.slug}\n\n是否立即访问？`)) window.open(`/p/${data.slug}`, "_blank"); }, 300);
      } catch (err) { showToast("异常：" + err.message, true); }
      finally { publishBtn.disabled = false; publishBtn.innerHTML = "🚀 立即发布并生成链接"; }
    }

    async function loadPageList() {
      try {
        const res = await fetch("/api/page/list", { headers: { "x-license-key": licenseKey } });
        if (res.status === 401) return;
        const data = await res.json();
        renderPageList(data.pages || []);
      } catch (_) {}
    }

    function renderPageList(pages) {
      const grid = document.getElementById("pageGrid");
      document.getElementById("pageCount").innerText = pages.length;
      grid.innerHTML = "";
      if (pages.length === 0) return grid.innerHTML = "<div style='grid-column: 1 / -1; text-align:center; padding: 40px; color:var(--text-sub);'>时空舱空空如也，在上方发布您的第一个回忆吧。</div>";
      pages.forEach(p => {
        const card = document.createElement("div"); card.className = "page-card";
        const pageUrl = `${window.location.origin}/p/${p.slug}`;
        card.innerHTML = `
          <div><div class="page-card-title">${escapeHtml(p.title)}</div><div class="page-card-slug">/p/${p.slug} ${p.hasPassword ? '🔒私密' : '🌐公开'}</div></div>
          <div>
            <div class="page-card-meta"><span>${formatBytes(p.size)}</span><span>${p.date}</span></div>
            <div class="page-card-actions">
              <button class="action-btn" onclick="copyText('${pageUrl}')">🔗 提取</button>
              <button class="action-btn" onclick="editPageSource('${p.slug}')">✏️ 修改</button>
              <a href="${pageUrl}" target="_blank" class="action-btn">👁️ 访问</a>
              <button class="action-btn" style="color:#ef4444;" onclick="deletePage('${p.slug}')">🗑️ 摧毁</button>
            </div>
          </div>`;
        grid.appendChild(card);
      });
    }

    async function editPageSource(slug) {
      try {
        const res = await fetch(`/api/page/get?slug=${encodeURIComponent(slug)}`, { headers: { "x-license-key": licenseKey } });
        if (res.ok) {
          const data = await res.json();
          titleInput.value = data.title; slugInput.value = data.slug; pwdInput.value = data.password; codeEditor.value = data.html;
          refreshPreview(); window.scrollTo({ top: 0, behavior: 'smooth' }); showToast("✓ 源码已回填，可覆写更新");
        }
      } catch (err) {}
    }

    async function deletePage(slug) {
      if (!confirm(`确定要彻底摧毁单页 /p/${slug} 吗？数据不可恢复！`)) return;
      try {
        const res = await fetch("/api/page/delete", { method: "POST", headers: { "Content-Type": "application/json", "x-license-key": licenseKey }, body: JSON.stringify({ slug }) });
        if (res.ok) { showToast("已成功摧毁释放空间"); loadPageList(); checkSystemStatus(); }
      } catch (_) {}
    }

    function copyText(text) { navigator.clipboard.writeText(text); showToast("✓ 链接已复制"); }
    function clearEditor() { if (confirm("确定要清空编辑框吗？")) { titleInput.value = ""; slugInput.value = ""; pwdInput.value = ""; codeEditor.value = ""; refreshPreview(); sizeTip.innerText = "当前代码：0 B"; } }

    function showToast(msg, isError = false) {
      const toast = document.getElementById("toastMsg"); toast.innerText = msg;
      if (isError) toast.classList.add("error"); else toast.classList.remove("error");
      toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 2500);
    }
    function escapeHtml(str) { return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function formatBytes(bytes) { if (!bytes || bytes === 0) return '0 B'; const k = 1024, sizes = ['B', 'KB', 'MB']; const i = Math.floor(Math.log(bytes) / Math.log(k)); return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i]; }

    checkSystemStatus();
  </script>
</body>
</html>
